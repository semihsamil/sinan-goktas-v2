<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şantiye Detayı | Mimar Sinan Göktaş</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <meta name="api-base" content="">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="js/api-host.js"></script>
    <script src="js/config.js"></script>
</head>
<body data-page="site-detail">
    <header class="site-header" id="site-header"></header>
    <div class="page-hero">
        <h1 id="site-title">Şantiye Detayı</h1>
        <p id="site-subtitle">Şantiye bilgileri</p>
    </div>
    <main class="section">
        <p class="site-detail-back">
            <a href="general-info.html" class="btn btn-ghost btn-sm">&larr; Şantiye listesine dön</a>
        </p>

        <div id="site-detail-error" class="form-status error" hidden></div>

        <div id="site-detail-content" hidden>
            <div class="section-card">
                <h2 class="section-title">İletişim ve Adres</h2>
                <ul class="site-detail-meta" id="site-detail-meta"></ul>
            </div>

            <div class="section-card" id="site-description-card" hidden>
                <h2 class="section-title">Açıklama</h2>
                <p id="site-description" class="site-detail-description"></p>
            </div>

            <div class="section-card">
                <h2 class="section-title">Konum Haritası</h2>
                <p class="site-address-line" id="site-address-line"></p>
                <div id="site-map-container"></div>
            </div>

            <div class="section-card">
                <h2 class="section-title">Şantiye Dosyaları</h2>
                <p class="section-lead">Bu şantiyeye ait genel bilgi dosyaları. İndirmek için dosya adına tıklayın.</p>
                <div id="site-file-list">Yükleniyor...</div>
                <div id="site-file-admin" class="site-file-admin" hidden>
                    <h3 class="tab-subtitle">Dosya Ekle (Admin)</h3>
                    <div class="form-group">
                        <label for="site-file-input">Dosya seç</label>
                        <input type="file" id="site-file-input" accept=".pdf,.doc,.docx,.xlsx,.xls,.txt,.png,.jpg,.jpeg">
                    </div>
                    <button type="button" class="btn btn-primary" id="site-file-upload">Dosya Ekle</button>
                    <div id="site-file-progress" class="progress-wrap">
                        <progress value="0" max="100"></progress>
                        <span class="progress-text">0%</span>
                    </div>
                    <p id="site-file-status" class="form-status"></p>
                </div>
            </div>
        </div>
    </main>
    <footer class="site-footer"><p>&copy; <span id="year"></span> Mimar Sinan Göktaş</p></footer>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="js/site-detail.js"></script>
</body>
</html>
