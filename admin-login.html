<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi | Mimar Sinan Göktaş</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <meta name="api-base" content="">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api-host.js"></script>
    <script src="js/config.js"></script>
</head>
<body data-page="admin-login">
    <header class="site-header" id="site-header"></header>

    <div class="form-card">
        <h2 class="admin-login-title">Yönetici Girişi</h2>
        <p class="section-lead admin-login-lead">Admin paneline yalnızca bu sayfadan giriş yapılır.</p>

        <form id="admin-login-form">
            <div class="form-group">
                <label for="admin_username">Yönetici kullanıcı adı</label>
                <input type="text" id="admin_username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="admin_password">Şifre</label>
                <input type="password" id="admin_password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Admin Paneline Gir</button>
            <p id="admin-login-status" class="form-status" role="status"></p>
        </form>

        <p class="admin-login-footer">
            <a href="index.html">← Siteye dön</a>
            <span class="text-muted"> · </span>
            <a href="login.html">Kullanıcı girişi</a>
        </p>
    </div>

    <footer class="site-footer">
        <p>&copy; <span id="year"></span> Mimar Sinan Göktaş</p>
    </footer>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin-login.js"></script>
</body>
</html>
